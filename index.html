<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Moje portfolio</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="main-header">
    <div class="header-left">
        <img src="img/fondy.png" class="logo" alt="Logo">
        <h1 class="site-title">
            <a href="#" class="gold-text" data-page="uvod">Moje‑portfolio</a>
        </h1>
    </div>

    <nav class="main-nav">
        <div class="dropdown">
            <button class="dropdown-toggle">Výběr ▾</button>
            <div class="dropdown-menu">
                <a href="#" data-page="penze">Penzijní fondy</a>
                <a href="#" data-page="podilove-fondy">Podílové fondy</a>
                <a href="#" data-page="akcie">Akcie</a>
                <a href="#" data-page="etf">ETF</a>
                <a href="#" data-page="meny">Měny</a>
                <a href="#" data-page="portfolio" id="menu-portfolio" style="display:none;">Moje portfolio</a>
            </div>
        </div>

        <button id="btn-login" class="pill-button" onclick="openLoginModal()">Přihlásit</button>
        <button id="btn-logout" class="pill-button" onclick="logout()" style="display:none;">Odhlásit</button>
    </nav>
</header>


<!-- ================= LAYOUT ================= -->
<div class="layout">

    <!-- ===== MAIN CONTENT ===== -->
    <main id="mainContent" class="content">

        <!-- ✅ ÚVOD -->
        <section class="home-hero">
            <img src="img/fondy.png" class="hero-image" alt="Fondy">
            <h2>Investiční přehled</h2>
        </section>

        <!-- ✅ DLAŽDICE -->
        <section class="home-grid">
            <div class="home-card" data-page="penze">Penzijní fondy</div>
            <div class="home-card" data-page="podilove-fondy">Podílové fondy</div>
            <div class="home-card" data-page="akcie">Akcie</div>
            <div class="home-card" data-page="etf">ETF</div>
            <div class="home-card" data-page="meny">Měny</div>
        </section>

    </main>


    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">

        <!-- ✅ výběr měny -->
        <div class="currency-box">
            <label>Měna</label>
            <select>
                <option>CZK</option>
                <option>EUR</option>
                <option>USD</option>
            </select>
        </div>

        <!-- ✅ rychlá navigace -->
        <div class="side-grid">
            <div class="side-card" data-page="penze">Penzijní fondy</div>
            <div class="side-card" data-page="podilove-fondy">Podílové fondy</div>
            <div class="side-card" data-page="akcie">Akcie</div>
            <div class="side-card" data-page="etf">ETF</div>
            <div class="side-card" data-page="meny">Měny</div>
        </div>

    </aside>
</div>


<!-- ================= FOOTER ================= -->
<footer class="footer">
    <div class="footer-content">
        <a href="#" data-page="gdpr">GDPR</a>
        <a href="#" data-page="upozorneni">Investiční upozornění</a>
        <a href="#" data-page="slovnik">Slovníček</a>
    </div>
</footer>


<!-- ================= SCRIPTS ================= -->
<script src="js/portfolio.js"></script>
<script src="js/app.js"></script>

</body>
</html>
