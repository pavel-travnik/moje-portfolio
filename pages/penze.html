<h1>Penzijní fondy</h1>

<div class="view-switch">
  <button id="view-grid" class="active">Dlaždice</button>
  <button id="view-table">Řádky</button>
</div>

<div id="fundGrid" class="fund-grid"></div>

<div class="mobile-sort">
  <label for="mobile-sort-select">Seřadit podle</label>
  <select id="mobile-sort-select">
    <option value="name">Názvu</option>
    <option value="perf3Y">Výnosu 3 roky</option>
    <option value="lastValuationDate">Data ocenění</option>
    <option value="riskCategory">Rizikovosti</option>
  </select>

  <button id="mobile-sort-dir" aria-label="Změnit směr">
    ↑
  </button>
</div>

<div id="fundTable" class="hidden"></div>
